name: Project VAYU CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-build:
    name: Typecheck, Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Compiler Check (tsc --noEmit)
        run: npm run lint

      - name: Run ML & GIS Pipeline Unit Tests
        run: npx tsx scratch/test_ml_pipeline.ts

      - name: Run Live NOTAM Feeds Cross-Verification
        run: npx tsx scratch/verify_live_online_notams.ts

      - name: Run Production Bundle Build (Vite + esbuild)
        run: npm run build
