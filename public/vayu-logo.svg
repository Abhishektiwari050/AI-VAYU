<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vayuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- Jet Body Glow Gradient -->
    <linearGradient id="jetGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Runway Line Gradient -->
    <linearGradient id="runwayGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container Badge -->
  <rect width="512" height="512" rx="112" fill="url(#vayuBg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(59,130,246,0.3)" stroke-width="3"/>

  <!-- Subtle HUD Grid Accents -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  
  <!-- Takeoff Trajectory Motion Arc -->
  <path d="M 90 320 Q 220 290 390 140" fill="none" stroke="url(#runwayGrad)" stroke-width="3" stroke-dasharray="6 8" opacity="0.4"/>

  <!-- Jet Aircraft Silhouette (Climbing Takeoff Profile) -->
  <path d="
    M 100 270
    C 115 255, 150 240, 180 230
    L 200 160
    C 205 142, 215 138, 222 152
    L 248 212
    L 375 160
    C 410 145, 435 150, 420 178
    C 405 200, 320 260, 265 295
    L 230 345
    C 220 360, 208 355, 212 338
    L 222 298
    L 160 305
    L 125 318
    C 110 322, 95 315, 92 300
    Z" 
    fill="url(#jetGrad)" 
    stroke="#38bdf8" 
    stroke-width="7" 
    stroke-linejoin="round"
    filter="url(#neonGlow)"/>

  <!-- Cockpit Glass Accent -->
  <path d="M 360 175 L 395 162 C 405 158, 412 165, 402 175 Z" fill="#e0f2fe" opacity="0.85"/>

  <!-- Horizontal Runway Line (Base Precision Bar) -->
  <rect x="76" y="392" width="360" height="24" rx="12" fill="url(#runwayGrad)" filter="url(#neonGlow)"/>

  <!-- Thrust Afterburner Pulse Dot -->
  <circle cx="102" cy="285" r="7" fill="#38bdf8" filter="url(#neonGlow)"/>
</svg>
